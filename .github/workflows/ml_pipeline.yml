name: 🤖 ML Pipeline Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'DATASET/**'
      - '.github/workflows/ml_pipeline.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'DATASET/**'
      - '.github/workflows/ml_pipeline.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  ml-pipeline-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install ML dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install xgboost lightgbm catboost scikit-learn pandas numpy
        pip install stable-baselines3 torch gymnasium
        pip install psutil matplotlib seaborn
    
    - name: Test ML Pipeline Components
      run: |
        cd DATASET
        
        # Test 1: Dataset building (sans données réelles)
        echo "🧪 Test: Dataset building components"
        python -c "
        import sys
        sys.path.append('.')
        from build_dataset_multisrc import *
        print('✅ Dataset building components OK')
        "
        
        # Test 2: Policy Overlay
        echo "🧪 Test: Policy Overlay v2"
        python policy_overlay_v2.py
        echo "✅ Policy Overlay v2 OK"
        
        # Test 3: RL Environment
        echo "🧪 Test: RL Environment"
        python -c "
        import sys
        sys.path.append('.')
        from rl_env import TradingDatasetEnv
        import pandas as pd
        import numpy as np
        
        # Create dummy data
        df = pd.DataFrame({
            'ts': pd.date_range('2025-01-01', periods=100, freq='1min'),
            'sym': ['ESZ25_FUT_CME'] * 100,
            'c': np.random.randn(100).cumsum() + 1000,
            'atr': np.random.uniform(0.5, 2.0, 100),
            'pressure': np.random.uniform(-1, 1, 100),
            'vix': np.random.uniform(10, 30, 100)
        })
        
        env = TradingDatasetEnv(df, discret=True)
        obs, _ = env.reset()
        action = 0
        obs, reward, done, _, _ = env.step(action)
        print('✅ RL Environment OK')
        "
        
        # Test 4: Model training components (sans entraînement complet)
        echo "🧪 Test: Model training components"
        python -c "
        import sys
        sys.path.append('.')
        from train_baseline import *
        print('✅ Model training components OK')
        "
        
        echo "🎉 All ML Pipeline tests passed!"
    
    - name: Test Policy Overlay Scenarios
      run: |
        cd DATASET
        echo "🧪 Test: Policy Overlay Scenarios"
        python -c "
        from policy_overlay_v2 import *
        
        # Test scenarios
        scenarios = [
            ([0.10, 0.80, 0.10], 12.0, 0.3, 0.40),  # Calm, neutral
            ([0.30, 0.40, 0.30], 20.0, 0.7, 0.30),  # Normal, balanced
            ([0.35, 0.45, 0.20], 30.0, 1.2, 0.20),  # Elevated, down
            ([0.55, 0.20, 0.25], 45.0, 2.0, 0.50),  # High, down
        ]
        
        for i, (proba, vix, atr, pressure) in enumerate(scenarios, 1):
            result = overlay_decision_v2(proba, vix, atr, pressure, PolicyState())
            print(f'Scenario {i}: {result[\"decision\"]} (conf: {result[\"confidence\"]:.3f})')
        
        print('✅ Policy Overlay scenarios OK')
        "
    
    - name: Test Anti-Leakage Assertions
      run: |
        cd DATASET
        echo "🧪 Test: Anti-Leakage Assertions"
        python -c "
        import pandas as pd
        import numpy as np
        from train_baseline import clean_features
        
        # Create test data with leak features
        df = pd.DataFrame({
            'feature1': np.random.randn(100),
            'feature2': np.random.randn(100),
            'c_fwd': np.random.randn(100),  # Leak feature
            'y_dir_h': np.random.randint(0, 3, 100),  # Target
            'hi_win': np.random.randn(100),  # Leak feature
        })
        
        try:
            clean_features(df)
            print('❌ Anti-leakage failed - should have caught leak features')
            exit(1)
        except AssertionError as e:
            print(f'✅ Anti-leakage working: {e}')
        "
    
    - name: Test Dataset Quality Control
      run: |
        cd DATASET
        echo "🧪 Test: Dataset Quality Control"
        python -c "
        import pandas as pd
        import numpy as np
        from validate_dataset_qc import *
        
        # Create test dataset
        df = pd.DataFrame({
            'ts': pd.date_range('2025-01-01', periods=1000, freq='1min'),
            'sym': ['ESZ25_FUT_CME'] * 1000,
            'c': np.random.randn(1000).cumsum() + 1000,
            'atr': np.random.uniform(0.5, 2.0, 1000),
            'pressure': np.random.uniform(-1, 1, 1000),
            'y_dir_h': np.random.randint(0, 3, 1000),
        })
        
        # Test QC functions
        nan_ratios = check_nan_ratios(df)
        ranges = check_value_ranges(df)
        labels = check_label_distribution(df, 'y_dir_h')
        
        print(f'✅ QC functions OK - NaN ratios: {len(nan_ratios)}, Ranges: {len(ranges)}, Labels: {len(labels)}')
        "
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: ml-pipeline-test-results-${{ matrix.python-version }}
        path: |
          DATASET/test_results/
          DATASET/logs/
        retention-days: 7
    
    - name: Comment PR with Test Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Read test results if available
          let testResults = 'ML Pipeline tests completed successfully! 🎉';
          
          try {
            const resultsPath = path.join('DATASET', 'test_results');
            if (fs.existsSync(resultsPath)) {
              const files = fs.readdirSync(resultsPath);
              testResults += `\n\nTest artifacts: ${files.join(', ')}`;
            }
          } catch (error) {
            console.log('No test artifacts found');
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: testResults
          });

  ml-documentation-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check ML Documentation
      run: |
        echo "📚 Checking ML documentation..."
        
        # Check if README exists
        if [ ! -f "DATASET/README_ML_PIPELINE.md" ]; then
          echo "❌ DATASET/README_ML_PIPELINE.md missing"
          exit 1
        fi
        
        # Check if main README mentions ML pipeline
        if ! grep -q "ML Pipeline\|Machine Learning" README.md; then
          echo "⚠️  Main README should mention ML Pipeline"
        fi
        
        # Check if .gitignore excludes ML artifacts
        if ! grep -q "DATASET/dataset_.*\.parquet" .gitignore; then
          echo "❌ .gitignore should exclude ML datasets"
          exit 1
        fi
        
        echo "✅ ML documentation check passed"
    
    - name: Generate ML Pipeline Summary
      run: |
        echo "📊 ML Pipeline Summary:"
        echo "================================"
        
        # Count Python files in DATASET
        ML_FILES=$(find DATASET -name "*.py" | wc -l)
        echo "ML Python files: $ML_FILES"
        
        # Check for key components
        if [ -f "DATASET/build_dataset_multisrc.py" ]; then
          echo "✅ Dataset builder: Present"
        else
          echo "❌ Dataset builder: Missing"
        fi
        
        if [ -f "DATASET/train_baseline.py" ]; then
          echo "✅ Model trainer: Present"
        else
          echo "❌ Model trainer: Missing"
        fi
        
        if [ -f "DATASET/policy_overlay_v2.py" ]; then
          echo "✅ Policy overlay: Present"
        else
          echo "❌ Policy overlay: Missing"
        fi
        
        if [ -f "DATASET/rl_env.py" ]; then
          echo "✅ RL environment: Present"
        else
          echo "❌ RL environment: Missing"
        fi
        
        echo "================================"
